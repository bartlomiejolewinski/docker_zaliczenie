version: '3.8'

services:
  proxy:
    image: nginx:alpine  
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app_main
      - app_auth
  app_main:
    build: ./app-main
    expose:
      - "8080" 
    env_file:
      - .env
  app_auth:
    build: ./app-auth
    expose:
      - "8081" 
    env_file:
      - .env