events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location /auth {
            proxy_pass http://app_auth:8081;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://app_main:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}